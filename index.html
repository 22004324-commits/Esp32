<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IoT Sensor Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f5f5f5; margin: 0; padding: 20px; }
    h2 { text-align: center; color: #333; }
    .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    table { border-collapse: collapse; width: 100%; margin-top: 15px; }
    th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
    th { background-color: #4CAF50; color: white; }
    tr:nth-child(even) { background-color: #f9f9f9; }
    .status { text-align: center; font-style: italic; font-size: 14px; margin-bottom: 10px; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Dữ Liệu Cảm Biến Từ ESP32</h2>
    <div id="status" class="status" style="color: blue;">Đang kết nối tới máy chủ Render...</div>
    
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Dữ liệu mã hóa (HEX)</th>
          <th>Nhiệt độ giải mã (°C)</th>
          <th>Thời gian thu thập</th>
        </tr>
      </thead>
      <tbody id="data-table">
        </tbody>
    </table>
  </div>

  <script>
    // ĐƯỜNG LINK TỚI FILE API TRÊN RENDER CỦA BẠN
    const API_URL = "https://esp32-bvh1.onrender.com/get_data.php";

    async function fetchData() {
      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error("Lỗi mạng");
        
        const data = await response.json();
        const tbody = document.getElementById('data-table');
        tbody.innerHTML = ''; // Xóa dữ liệu cũ

        if (data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4">Chưa có dữ liệu trong Database</td></tr>';
          return;
        }

        // Lặp qua dữ liệu và tạo các hàng trong bảng
        data.forEach(row => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${row.id}</td>
            <td><code>${row.encrypted_temp}</code></td>
            <td><strong>${row.decrypted_temp} °C</strong></td>
            <td>${row.created_at}</td>
          `;
          tbody.appendChild(tr);
        });

        document.getElementById('status').innerText = "Đã cập nhật dữ liệu mới nhất (Tự động tải lại sau 5s)";
        document.getElementById('status').style.color = "green";

      } catch (error) {
        console.error("Lỗi:", error);
        document.getElementById('status').innerText = "Mất kết nối với Render hoặc đang chờ Server thức dậy...";
        document.getElementById('status').style.color = "red";
      }
    }

    // Chạy ngay khi mở trang
    fetchData();
    // Tự động tải lại sau mỗi 5 giây (5000ms)
    setInterval(fetchData, 5000);
  </script>

</body>
</html>
